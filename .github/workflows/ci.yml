# Verify, then build and publish the image.
#
# There is no integration tier here, unlike the other Arcadia services: the gateway
# owns no database and no topic, so there is no property that needs real
# infrastructure to prove. What it does own — the routing table, the middleware
# order, the token check — is covered by the unit suite, which runs the whole
# composed handler over a real socket.

name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: go.sum

      - name: Formatting
        run: |
          unformatted=$(gofmt -s -l . || true)
          if [ -n "$unformatted" ]; then
            echo "not gofmt-formatted:"; echo "$unformatted"; exit 1
          fi

      - name: Module graph
        run: |
          go mod verify
          go mod tidy
          # A dirty go.mod after tidy means the committed dependency set does not
          # match the imports, which is how a build works on one machine only.
          git diff --exit-code go.mod go.sum

      - name: Vet
        run: go vet ./...

      - name: Static analysis
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@2025.1.1
          staticcheck ./...

      - name: Tests
        # -race is not optional: the rate limiter is shared mutable state touched by
        # every concurrent request, and a data race there is a race in the hot path
        # of every call the platform serves.
        run: go test -race -count=1 -coverprofile=coverage.out ./...

      - name: Coverage
        run: go tool cover -func=coverage.out | tail -25

  # The routing table is the one thing a unit test cannot fully vouch for: it
  # asserts what the code says, not that a built binary actually listens and
  # forwards. So the built binary is started and asked.
  smoke:
    runs-on: ubuntu-latest
    needs: [verify]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: go.sum

      - name: Build
        run: go build -o bin/api-gateway ./cmd/api-gateway

      - name: Start and probe
        env:
          JWT_SECRET: a-ci-only-jwt-secret-at-least-32-characters
          HTTP_PORT: '8090'
          LOG_FORMAT: text
        run: |
          set -euo pipefail
          ./bin/api-gateway & gateway=$!
          trap 'kill $gateway 2>/dev/null || true' EXIT

          for _ in $(seq 30); do
            curl -fsS localhost:8090/livez >/dev/null 2>&1 && break
            sleep 1
          done

          echo "--- the binary answers its own health check ---"
          ./bin/api-gateway -health-check

          echo "--- every prefix the frontend calls is routed ---"
          routes=$(curl -fsS localhost:8090/)
          echo "$routes"
          for prefix in /auth /catalog /orders /wallet /payment /media /notifications /marketplace; do
            echo "$routes" | grep -q "\"$prefix\"" || { echo "$prefix is not routed"; exit 1; }
          done

          echo "--- an unrouted prefix is a problem document, not a 502 ---"
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8090/nope/v1)" = 404

          echo "--- a malformed token dies at the edge ---"
          test "$(curl -s -o /dev/null -w '%{http_code}' \
            -H 'Authorization: Bearer not-a-jwt' localhost:8090/catalog/v1/games)" = 401

          echo "--- and an absent token is passed through, not refused ---"
          # 503 because no catalog-service is running in this job: the request was
          # forwarded, which is the point. A 401 here would mean the gateway had
          # started requiring a token, and every public page would break.
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8090/catalog/v1/games)" = 503

  image:
    runs-on: ubuntu-latest
    needs: [verify, smoke]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to the registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          # A pull request gets its image built — proving the Dockerfile still
          # works — but never pushed.
          push: ${{ github.event_name != 'pull_request' }}
          # Pinned rather than left to the runner's native arch: `go build` in the
          # Dockerfile has no GOARCH set, so it compiles for whatever the buildx
          # host reports, and an image built on an arm64 runner crashed every
          # amd64 deployer with "exec format error" — the other services either
          # don't cross-compile a binary or already build multi-arch.
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to arcadia
    runs-on: ubuntu-latest
    needs: [image]
    # Only a real push to main gets rolled out — not a PR build, not a tag build.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Configure kubectl credentials
        run: |
          mkdir -p ~/.kube
          printf '%s' "${{ secrets.ARCADIA_KUBECONFIG }}" > ~/.kube/config
          chmod 600 ~/.kube/config

      # `set image` wouldn't trigger a rollout here: the tag is always :latest, so
      # the pod template's image string never changes. `rollout restart` forces new
      # pods regardless, and imagePullPolicy: Always (the default for :latest) means
      # they pull the image this workflow just pushed.
      - name: Roll out api-gateway
        run: |
          kubectl -n arcadia rollout restart deployment/api-gateway
          kubectl -n arcadia rollout status deployment/api-gateway --timeout=180s
